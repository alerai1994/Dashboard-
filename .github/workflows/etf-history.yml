name: Vertex ETF Historical Charts
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/etf-history.py
      - .github/workflows/etf-history.yml
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-etf-history
  cancel-in-progress: false
jobs:
  refresh-etf-history:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate ETF history collector
        run: python3 -m py_compile .github/scripts/etf-history.py
      - name: Fetch verified historic share prices
        run: python3 .github/scripts/etf-history.py
      - name: Publish ETF charts
        shell: bash
        run: |
          if [ ! -f etf-history.json ]; then
            echo "No history snapshot to publish"
            exit 0
          fi
          cp etf-history.json "$RUNNER_TEMP/vertex-etf-history.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/vertex-etf-history.json" etf-history.json
            git add etf-history.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: refresh verified ETF history [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
