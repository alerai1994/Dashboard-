name: Vertex Market Force Crypto Intraday History
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/market-force-intraday.py
      - .github/workflows/market-force-intraday.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-market-force-intraday
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate collector
        run: python3 -m py_compile .github/scripts/market-force-intraday.py
      - name: Collect actual 1H/4H/1D/1W price observations for all crypto identities
        run: python3 .github/scripts/market-force-intraday.py
      - name: Publish only refreshed historical price observations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart-history/crypto/intraday/
          if git diff --cached --quiet; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/intraday-stage"
          cp -R chart-history/crypto/intraday/. "$RUNNER_TEMP/intraday-stage/"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p chart-history/crypto/intraday
            cp -R "$RUNNER_TEMP/intraday-stage/." chart-history/crypto/intraday/
            git add chart-history/crypto/intraday/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: refresh verified Market Force intraday prices [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
