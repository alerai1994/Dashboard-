name: ORE Spot Order Book Snapshot
on:
  push:
    branches: [main]
    paths:
      - script.js
      - index.html
      - .github/scripts/ore-orderbook.py
      - .github/workflows/ore-orderbook.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-ore-orderbook
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate order book fetcher
        run: python3 -m py_compile .github/scripts/ore-orderbook.py
      - name: Read verified LBank spot depth
        run: python3 .github/scripts/ore-orderbook.py
      - name: Publish verified depth snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ore-orderbook.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh ORE LBank spot depth [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
