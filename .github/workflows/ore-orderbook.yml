name: ORE Spot Order Book Snapshot
on:
  push:
    branches: [main]
    paths:
      - script.js
      - index.html
      - .github/scripts/ore-orderbook.py
      - .github/scripts/crypto-orderbooks.py
      - .github/scripts/crypto-orderbooks-expanded.py
      - .github/scripts/crypto-orderbooks-multisource.py
      - crypto-extended.js
      - .github/workflows/ore-orderbook.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-ore-orderbook
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate order book fetcher
        run: python3 -m py_compile .github/scripts/ore-orderbook.py
      - name: Read verified LBank spot depth
        run: python3 .github/scripts/ore-orderbook.py
      - name: Validate all crypto collectors
        run: python3 -m py_compile .github/scripts/crypto-orderbooks.py
      - name: Validate expanded 288-crypto collector
        run: |
          python3 -m py_compile .github/scripts/crypto-orderbooks-expanded.py
          python3 .github/scripts/crypto-orderbooks-expanded.py --selftest
      - name: Refresh source-verified Spot depth for all 288 catalog assets
        run: python3 .github/scripts/crypto-orderbooks-expanded.py
      - name: Validate multi-source collector
        run: |
          python3 -m py_compile .github/scripts/crypto-orderbooks-multisource.py
          python3 .github/scripts/crypto-orderbooks-multisource.py --selftest
      - name: Collect verified Spot books across Binance Gate MEXC Bybit OKX KuCoin Coinbase
        run: python3 .github/scripts/crypto-orderbooks-multisource.py
      - name: Publish verified depth snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ore-orderbook.json ore-orderbook-data.js crypto-orderbooks.json crypto-orderbooks-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh ORE LBank spot depth [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            # Never replace a newer verified snapshot with an older run.
            if git cat-file -e origin/main:crypto-orderbooks.json 2>/dev/null; then
              python3 - <<'PY'
import json, subprocess
from datetime import datetime
def timestamp(data):
    try:
        return datetime.fromisoformat(data['generatedAt'].replace('Z', '+00:00')).timestamp()
    except (KeyError, TypeError, ValueError):
        return 0
with open('crypto-orderbooks.json', encoding='utf-8') as f:
    ours = timestamp(json.load(f))
remote = subprocess.run(['git','show','origin/main:crypto-orderbooks.json'],
                        text=True, capture_output=True)
theirs = timestamp(json.loads(remote.stdout)) if remote.returncode == 0 else 0
if theirs > ours:
    with open('/tmp/vertex-snapshot-skip','w') as out:
        out.write('remote newer')
PY
              if [ -f /tmp/vertex-snapshot-skip ]; then
                echo "A newer validated book snapshot is already published."
                exit 0
              fi
            fi
            # In a rebase, 'theirs' refers to this run's generated data files.
            # Preserve unrelated upstream commits; resolve only data conflicts.
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              echo "Book snapshot rebase failed; keeping upstream data unchanged."
              exit 1
            fi
            sleep 2
          done
          exit 1
