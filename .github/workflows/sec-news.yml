name: Vertex SEC Official News
on:
  push:
    branches: [main]
    paths: [script.js, index.html, .github/scripts/sec-news.py, .github/workflows/sec-news.yml]
  schedule:
    - cron: '10,40 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-sec-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and SEC script
        run: |
          node --check script.js
          python3 -m py_compile .github/scripts/sec-news.py
      - name: Collect official SEC news feeds
        run: python3 .github/scripts/sec-news.py
      - name: Publish SEC news archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sec-news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh official SEC news [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
