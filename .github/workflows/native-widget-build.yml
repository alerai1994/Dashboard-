name: Build Vertex native apps and widgets

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'widgets/**'
      - 'vertex-widget-sw.js'
      - '.github/workflows/native-widget-build.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android native app + Home widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android APK
        run: gradle -p native/android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vertex-crypto-android-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  apple:
    name: iPhone iPad and macOS native app + WidgetKit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd native/ios && xcodegen generate
      - name: Build iOS and iPadOS simulator app
        run: |
          cd native/ios
          xcodebuild -project VertexCrypto.xcodeproj -scheme VertexCrypto \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/VertexDerived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package iPhone/iPad simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/VertexDerived/Build/Products/Debug-iphonesimulator/VertexCrypto.app" \
            "$RUNNER_TEMP/VertexCrypto-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: vertex-crypto-ios-ipados-simulator
          path: ${{ runner.temp }}/VertexCrypto-iOS-Simulator.zip
          if-no-files-found: error
      - name: Build macOS desktop app and widget extension
        run: |
          cd native/ios
          xcodebuild -project VertexCrypto.xcodeproj -scheme VertexCryptoMac \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/VertexMacDerived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package macOS developer app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/VertexMacDerived/Build/Products/Debug/VertexCryptoMac.app" \
            "$RUNNER_TEMP/VertexCrypto-macOS-Developer.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: vertex-crypto-macos-unsigned-app
          path: ${{ runner.temp }}/VertexCrypto-macOS-Developer.zip
          if-no-files-found: error

  windows:
    name: Windows native desktop app and Widget SDK provider
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile Windows App SDK app and widget COM provider
        shell: pwsh
        run: |
          dotnet build native/windows/VertexCryptoProvider/VertexCryptoProvider.csproj `
            --configuration Release --runtime win-x64 -p:Platform=x64 `
            -p:AppxPackageSigningEnabled=false
      - name: Publish Windows application files
        shell: pwsh
        run: |
          dotnet publish native/windows/VertexCryptoProvider/VertexCryptoProvider.csproj `
            --configuration Release --runtime win-x64 --no-self-contained `
            -p:Platform=x64 -p:AppxPackageSigningEnabled=false `
            -o "$env:RUNNER_TEMP/VertexCryptoWindows"
      - uses: actions/upload-artifact@v4
        with:
          name: vertex-crypto-windows-developer-files
          path: ${{ runner.temp }}/VertexCryptoWindows/
          if-no-files-found: error

  linux:
    name: Linux GTK native app syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GTK application syntax
        run: python3 -m py_compile native/linux/vertex_crypto.py
      - name: Validate desktop launcher
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate native/linux/vertex-crypto.desktop
