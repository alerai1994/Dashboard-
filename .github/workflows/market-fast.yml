name: Vertex Fast Market Quotes
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/market-fast.py
      - .github/scripts/market-data.py
      - .github/workflows/market-fast.yml
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-market-fast
  cancel-in-progress: false
jobs:
  update-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate fast collector
        run: python3 -m py_compile .github/scripts/market-fast.py
      - name: Collect verified quotes for every market group
        run: python3 .github/scripts/market-fast.py
      - name: Publish fast quote snapshot
        shell: bash
        run: |
          if [ ! -f market-quotes.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-quotes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh fast market quotes [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
