name: Vertex Global Market Cap History
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/global-cap-history.py
      - .github/scripts/tv-totaldefi-ohlc.py
      - .github/workflows/global-cap-history.yml
  schedule:
    - cron: '8 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-global-cap-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install chart-data reader and validate Python
        run: |
          python3 -m pip install --quiet websocket-client
          python3 -m py_compile .github/scripts/global-cap-history.py .github/scripts/tv-totaldefi-ohlc.py
      - name: Collect actual historical market capitalisations
        run: python3 .github/scripts/global-cap-history.py
      - name: Publish verified history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(global-cap-history.json global-cap-total.json global-cap-total2.json global-cap-total3.json)
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then cp "$file" "$RUNNER_TEMP/$file"; fi
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do
              if [ -f "$RUNNER_TEMP/$file" ]; then cp "$RUNNER_TEMP/$file" "$file"; fi
            done
            git add -A -- "${files[@]}"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: refresh global OHLC candle feeds [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
