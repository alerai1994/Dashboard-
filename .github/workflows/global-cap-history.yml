name: Vertex Global Market Cap History
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/global-cap-history.py
      - .github/scripts/tv-totaldefi-ohlc.py
      - .github/workflows/global-cap-history.yml
  schedule:
    - cron: '8 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-global-cap-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install chart-data reader and validate Python
        run: |
          python3 -m pip install --quiet websocket-client
          python3 -m py_compile .github/scripts/global-cap-history.py .github/scripts/tv-totaldefi-ohlc.py
      - name: Collect actual historical market capitalisations
        run: python3 .github/scripts/global-cap-history.py
      - name: Publish verified history
        shell: bash
        run: |
          if [ ! -f global-cap-history.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp global-cap-history.json "$RUNNER_TEMP/global-cap-history.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/global-cap-history.json" global-cap-history.json
            git add global-cap-history.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: refresh real global crypto history [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
