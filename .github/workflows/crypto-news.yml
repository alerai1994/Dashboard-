name: Vertex Multi-source News
on:
  push:
    branches: [main]
    paths: [.github/workflows/crypto-news.yml]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-crypto-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public publisher RSS feeds
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime as dt, email.utils, json, pathlib, urllib.request, urllib.parse, xml.etree.ElementTree as ET, re
          from html.parser import HTMLParser
          sources = {
              "Injective Official": ("https://injective.com/blog", "injective.com"),
              "Ethereum Foundation": ("https://blog.ethereum.org/en/feed.xml", "ethereum.org"),
              "Bitcoin Core releases": ("https://github.com/bitcoin/bitcoin/releases.atom", "github.com"),
              "Solana Agave releases": ("https://github.com/anza-xyz/agave/releases.atom", "github.com"),
              "Chainlink Blog": ("https://blog.chain.link/rss/", "chain.link"),
              "Celestia Blog": ("https://blog.celestia.org/rss/", "celestia.org"),
              "Filecoin Blog": ("https://filecoin.io/blog/feed/index.xml", "filecoin.io"),
              "Circle Blog": ("https://www.circle.com/blog/rss.xml", "circle.com"),
              "Crypto.com Blog": ("https://blog.crypto.com/rss/", "crypto.com"),
              "Electric Coin Company": ("https://electriccoin.co/feed/", "electriccoin.co"),
              "dYdX Blog": ("https://integral.dydx.exchange/rss/", "dydx.exchange"),
              "Decentraland Blog": ("https://decentraland.org/blog/feed.xml", "decentraland.org"),
              "Chia Blog": ("https://chia.net/feed.xml", "chia.net"),
              "CoinDesk": ("https://www.coindesk.com/arc/outboundfeeds/rss/", "coindesk.com"),
              "Cointelegraph": ("https://cointelegraph.com/rss", "cointelegraph.com"),
              "The Block": ("https://www.theblock.co/rss.xml", "theblock.co"),
              "Decrypt": ("https://decrypt.co/feed", "decrypt.co"),
              "CryptoSlate": ("https://cryptoslate.com/feed/", "cryptoslate.com"),
              "CNBC Finance": ("https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664", "cnbc.com"),
              "CNBC Economy": ("https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258", "cnbc.com"),
              "CNBC Top News": ("https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114", "cnbc.com"),
              "BBC Business": ("https://feeds.bbci.co.uk/news/business/rss.xml", "bbc.co.uk"),
              "BBC World": ("https://feeds.bbci.co.uk/news/world/rss.xml", "bbc.co.uk"),
              "BBC Technology": ("https://feeds.bbci.co.uk/news/technology/rss.xml", "bbc.co.uk"),
              "Financial Times": ("https://www.ft.com/rss/home/international", "ft.com"),
              "Federal Reserve": ("https://www.federalreserve.gov/feeds/press_all.xml", "federalreserve.gov"),
              "NY Times Business": ("https://rss.nytimes.com/services/xml/rss/nyt/Business.xml", "nytimes.com"),
              "NY Times World": ("https://rss.nytimes.com/services/xml/rss/nyt/World.xml", "nytimes.com"),
              "NY Times Technology": ("https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml", "nytimes.com"),
              "MIT Technology Review": ("https://www.technologyreview.com/feed/", "technologyreview.com"),
          }
          project_sources = {"Ethereum Foundation":"ETH","Bitcoin Core releases":"BTC","Solana Agave releases":"SOL","Chainlink Blog":"LINK","Celestia Blog":"TIA","Filecoin Blog":"FIL","Circle Blog":"USDC","Crypto.com Blog":"CRO","Electric Coin Company":"ZEC","dYdX Blog":"DYDX","Decentraland Blog":"MANA","Chia Blog":"XCH","Injective Official":"INJ"}
          now = dt.datetime.now(dt.timezone.utc)
          path = pathlib.Path("crypto-news.json")
          def timestamp(value):
              try:
                  parsed = email.utils.parsedate_to_datetime(value)
              except (TypeError, ValueError):
                  parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
              return parsed.replace(tzinfo=dt.timezone.utc) if parsed.tzinfo is None else parsed.astimezone(dt.timezone.utc)
          class BlogLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = None
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      url = urllib.parse.urljoin("https://injective.com/", dict(attrs).get("href", ""))
                      parsed = urllib.parse.urlsplit(url)
                      if parsed.hostname == "injective.com" and re.fullmatch(r"/blog/[a-z0-9-]+/?", parsed.path) and not parsed.query:
                          self.active = [url, []]
              def handle_data(self, data):
                  if self.active:
                      self.active[1].append(data)
              def handle_endtag(self, tag):
                  if tag == "a" and self.active:
                      self.links.append(self.active)
                      self.active = None
          def injective_blog(raw):
              parser = BlogLinks()
              parser.feed(raw.decode("utf-8", "replace"))
              items = []
              for url, chunks in parser.links:
                  text = " ".join(" ".join(chunks).split())
                  match = re.search(r"\b([A-Za-z]{3,9}\s+\d{1,2},\s+\d{4})\s+\d+\s+min(?:ute)?s?\s+read\s+(.+)", text, re.I)
                  if not match:
                      continue
                  try:
                      stamp = next(dt.datetime.strptime(match[1], fmt).replace(tzinfo=dt.timezone.utc) for fmt in ("%B %d, %Y", "%b %d, %Y") if _date_valid(match[1], fmt))
                  except (StopIteration, ValueError):
                      continue
                  if not now - dt.timedelta(days=30) <= stamp <= now + dt.timedelta(minutes=5):
                      continue
                  title = re.sub(r"\s+(?:Featured|Community|Tokenization|Infrastructure|Ecosystem|Learn|Research)(?:\s+(?:Community|Tokenization|Infrastructure|Ecosystem|Learn|Research|Read More))*\s*$", "", match[2]).strip()
                  # Use the visible headline; a card may also contain an excerpt.
                  if title:
                      items.append({"title": title[:350], "url": url, "date": stamp.isoformat(), "source": "Injective Official", "project": "INJ", "datePrecision": "day"})
              return list({item["url"]: item for item in items}.values())
          def _date_valid(value, fmt):
              try:
                  dt.datetime.strptime(value, fmt)
                  return True
              except ValueError:
                  return False
          def fetch(pair):
              source, (url, domain) = pair
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Vertex-News/1.0 (public RSS reader)", "Accept": "text/html, application/rss+xml, application/atom+xml, application/xml, text/xml"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      raw = response.read(4_000_001)
                  if len(raw) > 4_000_000:
                      raise ValueError("Feed too large")
                  if source == "Injective Official":
                      items = injective_blog(raw)
                      if not items:
                          raise ValueError("No dated project entries parsed")
                      return source, items, None
                  root = ET.fromstring(raw)
                  items = []
                  for item in root.iter():
                      if item.tag.split("}")[-1] not in ("item", "entry"):
                          continue
                      fields = {child.tag.split("}")[-1]: child for child in item}
                      title = " ".join("".join(fields["title"].itertext()).split()) if "title" in fields else ""
                      link = next((child for child in item if child.tag.split("}")[-1] == "link" and child.get("rel", "alternate") == "alternate"), fields.get("link"))
                      if link is None:
                          continue
                      url = (link.get("href") or link.text or "").strip()
                      parsed = urllib.parse.urlsplit(url)
                      host = parsed.hostname or ""
                      if parsed.scheme != "https" or parsed.username or parsed.password or not (host == domain or host.endswith("." + domain) or (domain == "bbc.co.uk" and (host == "bbc.com" or host.endswith(".bbc.com")))):
                          continue
                      date = next((fields[key].text for key in ("pubDate", "published", "date", "updated") if key in fields and fields[key].text), "")
                      try:
                          stamp = timestamp(date)
                      except (TypeError, ValueError):
                          continue
                      if not title or stamp > now + dt.timedelta(minutes=5) or stamp < now - dt.timedelta(days=30):
                          continue
                      row = {"title": title[:350], "url": url, "date": stamp.isoformat(), "source": source}
                      if source in project_sources:
                          row.update(project=project_sources[source], official=True)
                          if source.endswith("releases"):
                              row["kind"] = "software-release"
                              row["title"] = source + ": " + row["title"]
                      items.append(row)
                  return source, items, None
              except Exception as error:
                  return source, [], type(error).__name__
          try:
              previous = json.loads(path.read_text())
          except (OSError, ValueError):
              previous = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              results = list(pool.map(fetch, sources.items()))
          status = {}
          fresh = []
          for source, items, error in results:
              status[source] = {"ok": error is None, "items": len(items)}
              if error:
                  status[source]["error"] = error
              fresh.extend(items)
          if not any(row["ok"] for row in status.values()):
              raise SystemExit("No publisher feed reachable; retaining previous archive")
          rows = {}
          for item in fresh + previous.get("items", []):
              try:
                  stamp = timestamp(item["date"])
                  if now - dt.timedelta(days=30) <= stamp <= now + dt.timedelta(minutes=5):
                      rows.setdefault(item["url"], item)
              except (KeyError, ValueError, TypeError):
                  continue
          payload = {"updatedAt": now.isoformat(), "sources": status, "items": sorted(rows.values(), key=lambda x: x["date"], reverse=True)[:8000]}
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Archived", len(payload["items"]), "headlines")
          # Targeted news search runs on the server, not in the user's browser.
          # Rotate through the exact app catalogue; prioritize commonly requested projects.
          project_path = pathlib.Path("crypto-project-news.json")
          html = pathlib.Path("assistente-mercati.html").read_text(encoding="utf-8")
          catalog_match = re.search(r"voiceCryptoCatalog=(\[\[.*?\]\]);", html, re.S)
          if not catalog_match:
              raise SystemExit("Project catalogue not found")
          catalogue = list(dict.fromkeys(tuple(row) for row in json.loads(catalog_match[1])))
          priority = {"BTC","ETH","SOL","INJ","ORE","BNB","XRP","LUNC","VRA","TAI","HOT","RAY","WLFI"}
          aliases = {"ORE":"ORE Solana","HOT":"Holochain","TAI":"TARS AI","LUNC":"Terra Luna Classic","GRAM":"Toncoin","POL":"Polygon","VRA":"Verasity","WLFI":"World Liberty Financial","NEAR":"NEAR Protocol"}
          try:
              old = json.loads(project_path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              old = {}
          remaining = [row for row in catalogue if row[1] not in priority]
          cursor = int(old.get("cursor",0)) % max(1,len(remaining))
          batch = [row for row in catalogue if row[1] in priority] + [remaining[(cursor+i)%len(remaining)] for i in range(min(24,len(remaining)))]
          def fold(text):
              return " ".join(re.findall(r"\w+", text.casefold(), re.UNICODE))
          def project_search(row):
              name,symbol = row
              term = aliases.get(symbol,re.sub(r"\s*\([^)]*\)", "", name).strip())
              query = '"' + term.replace('"','') + '" (crypto OR blockchain OR token OR cryptocurrency) when:30d'
              url = "https://news.google.com/rss/search?" + urllib.parse.urlencode({"q":query,"hl":"en-US","gl":"US","ceid":"US:en"})
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/rss+xml, text/xml"})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      raw=response.read(2_000_001)
                  if len(raw)>2_000_000: raise ValueError("Feed too large")
                  root=ET.fromstring(raw)
                  rows=[]
                  for item in root.findall(".//item"):
                      title=" ".join((item.findtext("title") or "").split())
                      link=(item.findtext("link") or "").strip()
                      source=" ".join((item.findtext("source") or "").split())
                      parsed=urllib.parse.urlsplit(link)
                      if parsed.scheme!="https" or parsed.hostname!="news.google.com" or not parsed.path.startswith("/rss/articles/") or not source or not title: continue
                      # Don't confuse a common ticker with an unrelated story.
                      clean=title.removesuffix(" - "+source)
                      key=" "+fold(clean)+" "
                      tokens=[fold(term),fold(name)]
                      if symbol=="ORE": tokens=["ore"]
                      matched=any(t and " "+t+" " in key for t in tokens)
                      crypto=bool(re.search(r"\b(crypto|blockchain|token|solana|coin|bitcoin|ethereum|defi|staking|exchange)\b",key))
                      ambiguous=symbol in {"ORE","HOT","ONE","NEAR","OP","GAS","PI","SEI","LINK","RAIN","GRASS","GATE","SKY","SUN","CAP","BEAM","FLUX","STABLE","TERRA","RENDER","DASH","JUP","X","S","M","U","Q"}
                      if not matched or ambiguous and not crypto: continue
                      try: stamp=timestamp(item.findtext("pubDate") or "")
                      except (TypeError,ValueError): continue
                      if not now-dt.timedelta(days=30)<=stamp<=now+dt.timedelta(minutes=5): continue
                      rows.append({"title":clean[:350],"url":link,"date":stamp.isoformat(),"source":source[:100],"project":symbol,"indexed":True})
                  return symbol,rows[:15],None
              except Exception as error:
                  return symbol,[],type(error).__name__
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              project_results=list(pool.map(project_search,batch))
          projects=old.get("projects",{})
          for symbol,items,error in project_results:
              previous_items=projects.get(symbol,{}).get("items",[])
              merged={}
              for item in items+previous_items:
                  try:
                      if now-dt.timedelta(days=30)<=timestamp(item["date"])<=now+dt.timedelta(minutes=5):
                          merged.setdefault(item["url"],item)
                  except (ValueError,TypeError,KeyError): continue
              projects[symbol]={"checkedAt":now.isoformat(),"ok":error is None,"error":error,"items":sorted(merged.values(),key=lambda x:x["date"],reverse=True)[:15]}
          project_path.write_text(json.dumps({"updatedAt":now.isoformat(),"catalogueSize":len(catalogue),"cursor":(cursor+24)%max(1,len(remaining)),"projects":projects},ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          print("Targeted projects checked",len(project_results),"successful",sum(error is None for _,_,error in project_results))

          PY
      - name: Publish news archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto-news.json crypto-project-news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh multi-source publisher headlines"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
