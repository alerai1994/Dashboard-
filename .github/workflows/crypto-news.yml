name: Vertex Multi-source News
on:
  push:
    branches: [main]
    paths: [.github/workflows/crypto-news.yml]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-crypto-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public publisher RSS feeds
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime as dt, email.utils, json, pathlib, urllib.request, urllib.parse, xml.etree.ElementTree as ET, re
          from html.parser import HTMLParser
          sources = {
              "Injective Official": ("https://injective.com/blog", "injective.com"),
              "CoinDesk": ("https://www.coindesk.com/arc/outboundfeeds/rss/", "coindesk.com"),
              "Cointelegraph": ("https://cointelegraph.com/rss", "cointelegraph.com"),
              "The Block": ("https://www.theblock.co/rss.xml", "theblock.co"),
              "Decrypt": ("https://decrypt.co/feed", "decrypt.co"),
              "CryptoSlate": ("https://cryptoslate.com/feed/", "cryptoslate.com"),
              "CNBC Finance": ("https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664", "cnbc.com"),
              "CNBC Economy": ("https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258", "cnbc.com"),
              "CNBC Top News": ("https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114", "cnbc.com"),
              "BBC Business": ("https://feeds.bbci.co.uk/news/business/rss.xml", "bbc.co.uk"),
              "BBC World": ("https://feeds.bbci.co.uk/news/world/rss.xml", "bbc.co.uk"),
              "BBC Technology": ("https://feeds.bbci.co.uk/news/technology/rss.xml", "bbc.co.uk"),
              "Financial Times": ("https://www.ft.com/rss/home/international", "ft.com"),
              "Federal Reserve": ("https://www.federalreserve.gov/feeds/press_all.xml", "federalreserve.gov"),
              "NY Times Business": ("https://rss.nytimes.com/services/xml/rss/nyt/Business.xml", "nytimes.com"),
              "NY Times World": ("https://rss.nytimes.com/services/xml/rss/nyt/World.xml", "nytimes.com"),
              "NY Times Technology": ("https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml", "nytimes.com"),
              "MIT Technology Review": ("https://www.technologyreview.com/feed/", "technologyreview.com"),
          }
          now = dt.datetime.now(dt.timezone.utc)
          path = pathlib.Path("crypto-news.json")
          def timestamp(value):
              try:
                  parsed = email.utils.parsedate_to_datetime(value)
              except (TypeError, ValueError):
                  parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
              return parsed.replace(tzinfo=dt.timezone.utc) if parsed.tzinfo is None else parsed.astimezone(dt.timezone.utc)
          class BlogLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = None
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      url = urllib.parse.urljoin("https://injective.com/", dict(attrs).get("href", ""))
                      parsed = urllib.parse.urlsplit(url)
                      if parsed.hostname == "injective.com" and re.fullmatch(r"/blog/[a-z0-9-]+/?", parsed.path) and not parsed.query:
                          self.active = [url, []]
              def handle_data(self, data):
                  if self.active:
                      self.active[1].append(data)
              def handle_endtag(self, tag):
                  if tag == "a" and self.active:
                      self.links.append(self.active)
                      self.active = None
          def injective_blog(raw):
              parser = BlogLinks()
              parser.feed(raw.decode("utf-8", "replace"))
              items = []
              for url, chunks in parser.links:
                  text = " ".join(" ".join(chunks).split())
                  match = re.search(r"\b([A-Za-z]{3,9}\s+\d{1,2},\s+\d{4})\s+\d+\s+min(?:ute)?s?\s+read\s+(.+)", text, re.I)
                  if not match:
                      continue
                  try:
                      stamp = next(dt.datetime.strptime(match[1], fmt).replace(tzinfo=dt.timezone.utc) for fmt in ("%B %d, %Y", "%b %d, %Y") if _date_valid(match[1], fmt))
                  except (StopIteration, ValueError):
                      continue
                  if not now - dt.timedelta(days=30) <= stamp <= now + dt.timedelta(minutes=5):
                      continue
                  title = re.sub(r"\s+(?:Featured|Community|Tokenization|Infrastructure|Ecosystem|Learn|Research)(?:\s+(?:Community|Tokenization|Infrastructure|Ecosystem|Learn|Research|Read More))*\s*$", "", match[2]).strip()
                  # Use the visible headline; a card may also contain an excerpt.
                  if title:
                      items.append({"title": title[:350], "url": url, "date": stamp.isoformat(), "source": "Injective Official", "project": "INJ", "datePrecision": "day"})
              return list({item["url"]: item for item in items}.values())
          def _date_valid(value, fmt):
              try:
                  dt.datetime.strptime(value, fmt)
                  return True
              except ValueError:
                  return False
          def fetch(pair):
              source, (url, domain) = pair
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Vertex-News/1.0 (public RSS reader)", "Accept": "text/html, application/rss+xml, application/atom+xml, application/xml, text/xml"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      raw = response.read(4_000_001)
                  if len(raw) > 4_000_000:
                      raise ValueError("Feed too large")
                  if source == "Injective Official":
                      items = injective_blog(raw)
                      if not items:
                          raise ValueError("No dated project entries parsed")
                      return source, items, None
                  root = ET.fromstring(raw)
                  items = []
                  for item in root.iter():
                      if item.tag.split("}")[-1] not in ("item", "entry"):
                          continue
                      fields = {child.tag.split("}")[-1]: child for child in item}
                      title = " ".join("".join(fields["title"].itertext()).split()) if "title" in fields else ""
                      link = fields.get("link")
                      if link is None:
                          continue
                      url = (link.get("href") or link.text or "").strip()
                      parsed = urllib.parse.urlsplit(url)
                      host = parsed.hostname or ""
                      if parsed.scheme != "https" or parsed.username or parsed.password or not (host == domain or host.endswith("." + domain) or (domain == "bbc.co.uk" and (host == "bbc.com" or host.endswith(".bbc.com")))):
                          continue
                      date = next((fields[key].text for key in ("pubDate", "published", "date") if key in fields and fields[key].text), "")
                      try:
                          stamp = timestamp(date)
                      except (TypeError, ValueError):
                          continue
                      if not title or stamp > now + dt.timedelta(minutes=5) or stamp < now - dt.timedelta(days=30):
                          continue
                      items.append({"title": title[:350], "url": url, "date": stamp.isoformat(), "source": source})
                  return source, items, None
              except Exception as error:
                  return source, [], type(error).__name__
          try:
              previous = json.loads(path.read_text())
          except (OSError, ValueError):
              previous = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              results = list(pool.map(fetch, sources.items()))
          status = {}
          fresh = []
          for source, items, error in results:
              status[source] = {"ok": error is None, "items": len(items)}
              if error:
                  status[source]["error"] = error
              fresh.extend(items)
          if not any(row["ok"] for row in status.values()):
              raise SystemExit("No publisher feed reachable; retaining previous archive")
          rows = {}
          for item in fresh + previous.get("items", []):
              try:
                  stamp = timestamp(item["date"])
                  if now - dt.timedelta(days=30) <= stamp <= now + dt.timedelta(minutes=5):
                      rows.setdefault(item["url"], item)
              except (KeyError, ValueError, TypeError):
                  continue
          payload = {"updatedAt": now.isoformat(), "sources": status, "items": sorted(rows.values(), key=lambda x: x["date"], reverse=True)[:8000]}
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Archived", len(payload["items"]), "headlines")
          PY
      - name: Publish news archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto-news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh multi-source publisher headlines"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
