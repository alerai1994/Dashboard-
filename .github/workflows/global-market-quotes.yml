name: Global Market Quotes

on:
  push:
    branches: [main]
    paths:
      - global-world.js
      - vertex.js
      - vertex.css
      - vertex-preview.html
      - global-world.css
      - global-quotes.json
      - .github/scripts/global_quotes.py
      - .github/workflows/global-market-quotes.yml
      - index.html
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-market-quotes
  cancel-in-progress: false

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate new frontend JavaScript
        run: node --check vertex.js
      - name: Validate market collector Python
        run: python3 -m py_compile .github/scripts/global_quotes.py
      - name: Collect verified market data
        run: python3 .github/scripts/global_quotes.py
      - name: Publish quote snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-quotes.json
          if ! git diff --cached --quiet; then
            git commit -m "data(global): refresh verified market quotes [skip ci]"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Market data published on attempt $attempt"
                exit 0
              fi
              echo "Remote advanced during quote refresh; retrying"
              sleep 2
            done
            echo "Could not publish after four non-destructive retries"
            exit 1
          fi
