name: Vertex Intraday Chart History
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/chart-history.py
      - .github/workflows/chart-history.yml
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-chart-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate chart history generator
        run: python3 -m py_compile .github/scripts/chart-history.py
      - name: Fetch verified Yahoo Finance OHLC history
        run: python3 .github/scripts/chart-history.py
      - name: Commit verified chart snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart-history/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh chart history [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
