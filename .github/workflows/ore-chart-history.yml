name: ORE Verified Candlestick History
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/ore-chart-history.py
      - .github/workflows/ore-chart-history.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vertex-ore-chart-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check ORE chart collector syntax
        run: python3 -m py_compile .github/scripts/ore-chart-history.py
      - name: Fetch LBank ORE/USDT verified OHLC
        run: python3 .github/scripts/ore-chart-history.py
      - name: Commit real ORE chart candles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ore-chart-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh ORE chart candles [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
