name: Update Dashboard Chart V544

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v543-chart-update.yml"
      - ".github/scripts/v543_graph_patch.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-dashboard-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Apply V544 cleanup to the main chart
        run: python3 .github/scripts/v543_graph_patch.py
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Commit edited dashboard files
        shell: bash
        run: |
          if git diff --quiet -- index.html style.css script.js; then
            echo "Chart already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css script.js
          git commit -m "Deploy clean chart: EMA 12 26 50 200, MACD, Stoch RSI, RSI and pan-only history"
          git push origin HEAD:main
