name: VertexCrypto
options:
  bundleIdPrefix: com.vertex
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  VertexCrypto:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vertex.crypto
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vertex Crypto
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: VertexCryptoWidgetExtension
        embed: true
  VertexCryptoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: VertexCryptoWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vertex.crypto.widgets
        APPLICATION_EXTENSION_API_ONLY: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Widget Crypto Vertex
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
